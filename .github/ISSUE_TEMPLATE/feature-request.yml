name: Feature request
description: Propose an outcome for RLY Gateway.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user workflow or limitation, not only a proposed implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should a user be able to observe or complete?
    validations:
      required: true
  - type: input
    id: scope
    attributes:
      label: Client, provider, and model scope
      placeholder: Claude Code / OpenRouter / model family
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and security impact
      description: Note streaming, tools, reasoning, credentials, routing, or configuration implications.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: This request contains no credentials, account identity, prompts, responses, or private configuration.
          required: true
