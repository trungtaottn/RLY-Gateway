name: Bug report
description: Report a reproducible RLY Gateway defect without sharing private data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, account identities, prompts, responses, or unredacted local configuration. Report security vulnerabilities privately through SECURITY.md.
  - type: input
    id: version
    attributes:
      label: RLY version
      description: Paste the output of `rly --version` or the release tag.
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS Apple Silicon
        - macOS Intel
        - Linux x86-64
        - Linux ARM64
        - Other
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Client and version
      description: For example Claude Code or Codex CLI and its version.
    validations:
      required: true
  - type: input
    id: route
    attributes:
      label: Provider and model selector
      description: Use provider/model IDs only. Do not include account or credential data.
      placeholder: openrouter / claude-rly-openrouter-...
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal redacted steps starting from a clean RLY invocation.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include redacted errors or secret-free diagnostics only.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Relevant redacted output from `rly doctor`, `rly status`, or `rly route-trace`.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials, tokens, account identity, prompts, responses, and machine-local private paths.
          required: true
        - label: This is not a security vulnerability report.
          required: true
